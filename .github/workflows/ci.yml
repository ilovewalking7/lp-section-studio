name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (registry + typecheck + vite build)
        run: npm run build

      - name: Test (render all 260 components — no errors/warnings)
        run: npm test

      - name: Verify registry output exists
        run: test -f public/r/index.json && echo "registry OK"
