name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# push と pull_request の両方で発火するため同じコミットで2本走る。
# 古い方を打ち切って実行時間とランナーを無駄にしない。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (registry + typecheck + vite build)
        run: npm run build

      - name: Test (描画・コントラスト・a11y・キーボード)
        run: npm test

      - name: Install Chromium (横スクロール検査用)
        run: npx playwright install --with-deps chromium

      - name: Check horizontal overflow (幅375pxで全件描画)
        timeout-minutes: 20
        run: npm run check:overflow

      - name: Verify registry output exists
        run: test -f public/r/index.json && echo "registry OK"
